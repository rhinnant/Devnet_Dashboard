- name: Push Docker image
  run: |
    docker push ghcr.io/rhinnant/django-app:${{ env.IMAGE_TAG }}

- name: Update Kubernetes deployment image
  run: |
    sed -i "s|image: ghcr.io/rhinnant/django-app:.*|image: ghcr.io/rhinnant/django-app:${GITHUB_SHA}|g" k8s/deployment.yaml

- name: Commit updated manifest
  run: |
    git config user.name "github-actions"
    git config user.email "github-actions@github.com"
    git add k8s/deployment.yaml
    git commit -m "Update image tag to ${GITHUB_SHA}" || echo "No changes"
    git push
