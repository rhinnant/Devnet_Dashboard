name: Docker CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/rhinnant/django-app
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Update Kubernetes deployment image
        run: |
          sed -i "s|image: ghcr.io/rhinnant/django-app:.*|image: ghcr.io/rhinnant/django-app:${GITHUB_SHA}|g" k8s/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Update image tag to ${GITHUB_SHA}" || echo "No changes"
          git push
