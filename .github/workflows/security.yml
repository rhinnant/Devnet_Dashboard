name: DevSecOps Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python (for Django context awareness)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies (lightweight scan support)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Secret scanning (Gitleaks)
    name: Run Gitleaks (Secret Scan)
    uses: gitleaks/gitleaks-action@v2
    continue-on-error: true
    env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Filesystem vulnerability scan (Trivy)
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # 6. Docker image scan (optional but powerful)
      - name: Build Docker image
        run: docker build -t devnet-dashboard:scan .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devnet-dashboard:scan
          format: table
