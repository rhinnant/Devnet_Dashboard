# ── Global defaults ──────────────────────────────────────────
default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ── Stages ───────────────────────────────────────────────────
stages:
  - build
  - scan

# ── Variables ────────────────────────────────────────────────
variables:
  IMAGE_REGISTRY: registry.gitlab.com
  IMAGE_PATH: reg.hinnant-group/enterprise_version_ticketsystem
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $IMAGE_REGISTRY/$IMAGE_PATH:latest
  IMAGE_VERSIONED: $IMAGE_REGISTRY/$IMAGE_PATH:$IMAGE_TAG
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"


# ════════════════════════════════════════════════════════════
#  STAGE 1 · BUILD
#  Builds the Docker image and pushes both :sha and :latest tags
# ════════════════════════════════════════════════════════════
build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $IMAGE_REGISTRY
        --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      docker build \
        --label "git.commit=$CI_COMMIT_SHA" \
        --label "git.branch=$CI_COMMIT_REF_NAME" \
        --label "build.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --cache-from "$IMAGE_LATEST" \
        --tag "$IMAGE_VERSIONED" \
        --tag "$IMAGE_LATEST" \
        .
    - docker push "$IMAGE_VERSIONED"
    - docker push "$IMAGE_LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"


# ════════════════════════════════════════════════════════════
#  STAGE 2 · SCAN
#  Trivy scans the image; exits non-zero on HIGH or CRITICAL
# ════════════════════════════════════════════════════════════
scan:trivy:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  cache:
    paths:
      - .trivycache/
  before_script:
    - trivy image --download-db-only --no-progress
  script:
    # ── 1. Full HTML report saved as artifact ────────────────
    - |
      trivy image \
        --username "$CI_REGISTRY_USER" \
        --password "$CI_REGISTRY_PASSWORD" \
        --format template \
        --template "@contrib/html.tpl" \
        --output trivy-report.html \
        --severity CRITICAL,HIGH,MEDIUM,LOW \
        --no-progress \
        "$IMAGE_VERSIONED"

    # ── 2. SARIF for GitLab Security Dashboard ───────────────
    - |
      trivy image \
        --username "$CI_REGISTRY_USER" \
        --password "$CI_REGISTRY_PASSWORD" \
        --format sarif \
        --output trivy-results.sarif \
        --severity CRITICAL,HIGH,MEDIUM,LOW \
        --no-progress \
        "$IMAGE_VERSIONED"

    # ── 3. Policy gate — blocks on HIGH or CRITICAL ──────────
    - |
      trivy image \
        --username "$CI_REGISTRY_USER" \
        --password "$CI_REGISTRY_PASSWORD" \
        --exit-code 1 \
        --severity CRITICAL,HIGH \
        --ignore-unfixed \
        --no-progress \
        "$IMAGE_VERSIONED"
  artifacts:
    when: always
    paths:
      - trivy-report.html
    reports:
      sast: trivy-results.sarif
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - job: build

