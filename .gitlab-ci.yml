stages:
  - test
  - deploy

# ---------------- TEST ----------------
test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - python manage.py check

# ---------------- DEPLOY ----------------
deploy:
  stage: deploy
  image: docker:24
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t devnet_dashboard .
    - docker stop devnet || true
    - docker rm devnet || true
    - docker run -d -p 8080:8000 --name devnet devnet_dashboard
