stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: hinn8823/devnet_dashboard_itdash:latest

# -------------------------
# BUILD + PUSH
# -------------------------
build:
  stage: build
  tags:
    - local
  script:
    - echo "=== BUILD STAGE ==="

    - docker --version
    - docker info

    - echo "Logging into DockerHub..."
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

    - echo "Building image..."
    - docker build -t $DOCKER_IMAGE .

    - echo "Pushing image..."
    - docker push $DOCKER_IMAGE

# -------------------------
# DEPLOY TO MINIKUBE
# -------------------------
deploy:
  stage: deploy
  tags:
    - local
  script:
    - echo "=== DEPLOY STAGE ==="

    - kubectl config current-context
    - kubectl cluster-info

    - echo "Updating deployment image..."
    - sed -i "s|image: .*|image: $DOCKER_IMAGE|g" k8s/apps/django/deployment.yaml

    - echo "Applying Kubernetes manifests..."
    - kubectl apply -f k8s/apps/django/deployment.yaml

    - echo "Waiting for rollout..."
    - kubectl rollout status deployment/django-app

    - echo "=== DEPLOYMENT COMPLETE ==="
