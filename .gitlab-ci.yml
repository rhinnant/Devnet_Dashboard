stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: devnet_dashboard_itdash:$CI_COMMIT_SHORT_SHA
  KUBE_DEPLOY_FILE: django-deploy1.yaml

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Using Minikube Docker daemon..."
    - eval $(minikube docker-env)

    - echo "Building image inside Minikube..."
    - docker build -t $DOCKER_IMAGE .

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG" > ~/.kube/config

    - 'sed -i "s|image: .*|image: $DOCKER_IMAGE|g" $KUBE_DEPLOY_FILE'

    - kubectl apply -f $KUBE_DEPLOY_FILE
    - kubectl rollout status deployment/django-app
