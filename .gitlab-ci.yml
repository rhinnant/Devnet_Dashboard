stages:
  - build
  - test
  - push
  - deploy

variables:
  IMAGE_NAME: hinn8823/devnet_dashboard

# ---------------- BUILD ----------------
build:
  stage: build
  image: docker:24
  services:
    - docker:dind
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA .

# ---------------- TEST ----------------
test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - python manage.py check

# ---------------- PUSH TO DOCKER HUB ----------------
push:
  stage: push
  image: docker:24
  services:
    - docker:dind
  script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
    - docker build -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:latest

# ---------------- DEPLOY LOCAL ----------------
deploy:
  stage: deploy
  image: docker:24
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker pull $IMAGE_NAME:latest || true
    - docker stop devnet || true
    - docker rm devnet || true
    - docker run -d -p 8080:8000 --name devnet $IMAGE_NAME:latest
