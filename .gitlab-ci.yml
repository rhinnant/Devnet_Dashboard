stages:
  - deploy

deploy-local:
  stage: deploy
  tags:
    - local
  script:
    - echo "=== DEPLOYING TO MINIKUBE ==="

    - whoami
    - kubectl config current-context

    - echo "Applying deployment..."
    - kubectl apply -f k8s/test-deploy.yaml

    - echo "Waiting for rollout..."
    - kubectl rollout status deployment/test-nginx

    - echo "Checking pods..."
    - kubectl get pods

    - echo "=== DEPLOY SUCCESS ==="
