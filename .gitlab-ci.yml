stages:
  - build
  - test
  - push
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/devnet_dashboard

# ---------------- BUILD ----------------
build:
  stage: build
  image: docker:24
  services:
    - docker:dind
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA .
    - docker images

# ---------------- TEST ----------------
test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - python manage.py check
    - python manage.py test

# ---------------- PUSH ----------------
push:
  stage: push
  image: docker:24
  services:
    - docker:dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:latest

# ---------------- DEPLOY (LOCAL SIMULATION) ----------------
deploy:
  stage: deploy
  script:
    - echo "Deploying locally..."
    - docker pull $IMAGE_NAME:latest || true
    - docker stop devnet || true
    - docker rm devnet || true
    - docker run -d -p 8080:8000 --name devnet $IMAGE_NAME:latest
