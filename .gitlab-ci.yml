stages:
  - build

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:latest

build_and_push:
  stage: build
  image: docker:24
  services:
    - docker:dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
