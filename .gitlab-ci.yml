stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: devnet_dashboard_itdash:$CI_COMMIT_SHORT_SHA
  DOCKERFILE_PATH: Dockerfile
  BUILD_CONTEXT: .
  KUBE_DEPLOY_FILE: django-deploy1.yaml

# -----------------------
# BUILD STAGE (LOCAL IMAGE)
# -----------------------
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Building Docker image locally..."

    # If using Minikube, this allows image to be used directly
    - eval $(minikube docker-env) || true

    - docker build -t $DOCKER_IMAGE -f $DOCKERFILE_PATH $BUILD_CONTEXT

    - echo "Image built:"
    - docker images | grep devnet_dashboard_itdash

# -----------------------
# DEPLOY STAGE (KUBERNETES)
# -----------------------
deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]   # 🔥 FIX: prevents kubectl overriding shell
  script:
    - echo "Setting up kubeconfig..."

    - mkdir -p ~/.kube
    - echo "$KUBECONFIG" > ~/.kube/config

    - echo "Updating deployment image..."
    - |
      sed -i "s|image: .*|image: $DOCKER_IMAGE|g" $KUBE_DEPLOY_FILE

    - echo "Applying Kubernetes manifests..."
    - kubectl apply -f $KUBE_DEPLOY_FILE

    - echo "Waiting for rollout..."
    - kubectl rollout status deployment/django-app
